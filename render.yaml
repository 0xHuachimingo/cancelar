# Backend (API) y base de datos en Render. Se usa desde el panel de Render:
# New → Blueprint → elegir este repositorio. Ver DEPLOY-VERCEL-RENDER.md.
services:
  - type: web
    name: servicio-tecnico-api
    runtime: node
    rootDir: backend
    # --include=dev: hacen falta las herramientas de compilación (Nest CLI, TypeScript)
    buildCommand: npm ci --include=dev && npm run build
    # Aplica las migraciones pendientes antes de arrancar
    startCommand: npx prisma migrate deploy && node dist/main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: servicio-tecnico-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # Dirección del frontend en Vercel (si cambia el dominio, actualizar acá)
      - key: CORS_ORIGIN
        value: https://cancelar-mu.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      # Delante de la API están el proxy de Vercel (/api) y el de Render
      - key: TRUST_PROXY
        value: "2"
      # En el disco persistente: las evidencias no se pierden al reiniciar o redesplegar
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: UPLOAD_MAX_MB
        value: "10"
    # El disco persistente requiere un plan pago de Render (Starter o superior).
    # Sin disco, las fotos y PDF de evidencia se borran en cada reinicio.
    disk:
      name: evidencias
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: servicio-tecnico-db
    databaseName: servicio_tecnico
    user: servicio_tecnico
